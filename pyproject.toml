[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-podcast"
version = "0.1.0"
description = "Automated YouTube interest & channel digest pipeline to Chinese podcast RSS feed"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "edge-tts>=6.1.12",
    "yt-dlp>=2024.10.0",
    "youtube-transcript-api>=0.6.2",
    "mutagen>=1.47.0",
]

[project.optional-dependencies]
antigravity = ["google-antigravity>=0.1.0"]
gemini = ["google-genai>=1.0.0"]
s3 = ["boto3>=1.35.0"]
all = [
    "google-antigravity>=0.1.0",
    "google-genai>=1.0.0",
    "boto3>=1.35.0",
]

[project.scripts]
yt-podcast = "yt_podcast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
