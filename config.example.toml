# yt-podcast configuration template
# Copy to config.toml and customize your channels, interests, and publishing target.

[discovery]
# Channels to monitor via YouTube's public Atom RSS feed.
# Supports UC... channel IDs, @handles, or full https://www.youtube.com/... channel URLs.
channels = [
    "@TwoMinutePapers",
    "@Fireship",
    "UCbfYPyITQ-7l4upoX8nvctg", # Two Minute Papers
]

# Topics / interests to search via yt-dlp (e.g. ytsearchN:<query>)
interests = [
    "AI agents engineering",
    "LLM inference optimization",
]

# Only include videos published within the last N hours
lookback_hours = 72
# Maximum number of videos per search query
max_results_per_interest = 5
# Maximum number of videos per channel RSS feed
max_results_per_channel = 3
# Maximum total videos included in one digest episode
max_videos_total = 6
# Filter out YouTube Shorts (< 180s) and ultra-long livestreams (> 2 hours)
min_duration_seconds = 180
max_duration_seconds = 7200
# Preferred transcript languages in priority order
transcript_languages = ["zh-Hans", "zh-CN", "zh", "en", "en-US"]
# Maximum transcript characters kept per video before LLM pass 1
max_transcript_chars = 12000

[llm]
# Provider options:
#   "antigravity" - Uses the Antigravity Python SDK (google-antigravity) directly
#   "gemini"      - Uses Google Gemini API (requires GEMINI_API_KEY)
#   "staged"      - Writes a prompt markdown file in data/staged/ so you can generate
#                   the script in any chat and resume via: yt-podcast run --from-script <path>
provider = "antigravity"
# Optional model override (used for gemini provider, e.g. "gemini-2.5-flash")
model = "gemini-2.5-flash"
# Target spoken podcast length in minutes
target_minutes = 15
# Target podcast language ("zh-CN" translates non-Chinese videos into natural Chinese)
language = "zh-CN"
# Average Chinese speech speed used to compute target character count (~240 chars/min)
chars_per_minute = 240
# Optional extra tone/style guidance for the host
style_notes = "自然口语化、逻辑清晰、像一位资深科技播客主理人在与听众聊最新技术动态，避免生硬书面翻译腔。"

[tts]
# Edge TTS voice (run `yt-podcast voices` to list available Chinese voices)
# Popular single-host Mandarin voices:
#   zh-CN-YunxiNeural    (natural male narrator)
#   zh-CN-XiaoxiaoNeural (warm female narrator)
#   zh-CN-YunjianNeural  (broadcast/news male)
#   zh-CN-XiaoyiNeural   (lively female)
voice = "zh-CN-YunxiNeural"
rate = "+0%"
pitch = "+0Hz"
# Maximum characters per TTS request chunk
max_chunk_chars = 650

[podcast]
title = "每日科技精选播客"
subtitle = "YouTube 频道与前沿技术自动摘要（中文版）"
description = "自动追踪关注的 YouTube 频道与技术兴趣主题，提炼核心洞察并翻译生成约 15 分钟的中文音频播客。"
author = "AI Podcast Digest"
email = "podcast@example.com"
language = "zh-cn"
category = "Technology"
explicit = false
# Public base URL where feed.xml, index.html, and episodes/*.mp3 will be hosted.
# Examples:
#   GitHub Pages: "https://<username>.github.io/<repo>"
#   Cloudflare R2: "https://pub-xxxx.r2.dev"
base_url = "https://example.github.io/yt-podcast"
# Optional square cover art URL (recommended 1400x1400 to 3000x3000 JPG/PNG for Apple Podcasts)
image_url = ""

[publishing]
# Backend options:
#   "local"        - Writes MP3, feed.xml, and index.html into output_dir only
#   "github_pages" - Writes into output_dir (e.g. "docs") and runs git add/commit(/push)
#   "s3"           - Uploads MP3, feed.xml, and index.html to S3 / Cloudflare R2 via boto3
backend = "local"
output_dir = "docs"
auto_push = false
git_remote = "origin"
git_branch = "main"

[paths]
state_db = "data/state.db"
staged_dir = "data/staged"
work_dir = "data/work"
