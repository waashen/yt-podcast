# yt-podcast active configuration
# Customize channels, interests, base_url, and publishing backend as needed.

[discovery]
channels = [
    "@TinaHuang1",
    "@mattpocockuk",
]
interests = []
lookback_hours = 960
max_results_per_interest = 5
max_results_per_channel = 3
max_videos_total = 6
min_duration_seconds = 180
max_duration_seconds = 7200
transcript_languages = ["zh-Hans", "zh-CN", "zh", "en", "en-US"]
max_transcript_chars = 12000

[llm]
provider = "staged"
model = "gemini-2.5-flash"
target_minutes = 15
language = "zh-CN"
chars_per_minute = 240
style_notes = "自然口语化、逻辑清晰、像一位资深科技播客主理人在与听众聊最新技术动态，避免生硬书面翻译腔。"

[tts]
voice = "zh-CN-YunxiNeural"
rate = "+0%"
pitch = "+0Hz"
max_chunk_chars = 650

[podcast]
title = "每日科技精选播客"
subtitle = "YouTube 频道与前沿技术自动摘要（中文版）"
description = "自动追踪关注的 YouTube 频道与技术兴趣主题，提炼核心洞察并翻译生成约 15 分钟的中文音频播客。"
author = "AI Podcast Digest"
email = "podcast@example.com"
language = "zh-cn"
category = "Technology"
explicit = false
base_url = "https://waashen.github.io/yt-podcast"
image_url = ""

[publishing]
backend = "github_pages"
output_dir = "docs"
auto_push = true
git_remote = "origin"
git_branch = "main"

[paths]
state_db = "data/state.db"
staged_dir = "data/staged"
work_dir = "data/work"
